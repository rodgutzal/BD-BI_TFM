name: Tests & Code Quality

# BD_BI_TFM: dispara en las convenciones de rama de ambos repos
# originales (BD_BI_TFM usaba `develop`, urban-mobility-analytics1 usaba
# `main`).
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # BD_BI_TFM fix: el setup.py original declaraba
        # python_requires=">=3.13" pero el CI solo probaba 3.10-3.12 (ninguna
        # de esas versiones cumplía su propio requisito). Se alinearon
        # ambos a ">=3.10", que es lo que realmente usa el código (p.ej.
        # `str | None` en src/config.py, sintaxis de PEP 604).
        #
        # Sin 3.10: requirements.txt fija pandas==3.0.3 y numpy==2.4.6, y el
        # Dockerfile ya usa 3.11. Las dos versiones de arriba son las que
        # realmente se pueden instalar con esos pines.
        python-version: [ '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verify package structure (guards against the analytics/ collision bug)
      run: |
        python -c "
        from src.analytics import MobilityAnalytics
        from src.analytics.causal_analysis import CausalAnalysis
        from src.analytics.time_series_analysis import TimeSeriesAnalytics
        from src.database import RouteDatabase
        from src.locations import LOCATIONS, ROUTES
        from src.collector import DataCollector, HybridScheduler
        from src.data_warehouse.bronze_layer import BronzeLayer
        from src.data_warehouse.silver_layer import SilverLayer
        from src.data_warehouse.gold_layer import GoldLayer
        print('✅ Todos los módulos internos importan correctamente')
        "

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      continue-on-error: true  # no bloquea el pipeline si no hay CODECOV_TOKEN configurado
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    # BLOQUEANTE: errores que rompen el código de verdad (sintaxis, nombres
    # sin definir). Antes todo esto terminaba en `|| true`, así que nunca
    # podía fallar; además `--enable=error,fatal` no es una opción válida de
    # pylint (ignoraba la orden y no revisaba nada). `E,F` son las categorías
    # Error y Fatal.
    - name: Check code quality (blocking)
      run: |
        flake8 src/ tests/ --select=E9,F63,F7,F82 --show-source --statistics
        # Imports sin usar (F401): se limpiaron en el PR #50; aqui se impide que vuelvan.
        flake8 src/ tests/ streamlit_app/ --select=F401 --show-source --statistics
        pylint src/ --disable=all --enable=E,F

    # INFORMATIVO: estilo. Hoy hay avisos pendientes (E402
    # por los sys.path.insert de los dashboards...); no bloquea el pipeline
    # pero queda visible como paso con aviso en vez de ocultarse.
    - name: Check code style (informational)
      continue-on-error: true
      run: |
        flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503

    - name: Data quality checks
      run: |
        python -c "
        import sqlite3
        from pathlib import Path

        db_path = Path('data/mobility.db')
        if not db_path.exists():
            print('⚠️  data/mobility.db no existe en este checkout (esperado en forks limpios)')
            raise SystemExit(0)

        conn = sqlite3.connect(db_path)
        cursor = conn.cursor()
        for table in ('route_measurements', 'bronze_measurements', 'silver_measurements', 'gold_route_kpis'):
            try:
                cursor.execute(f'SELECT COUNT(*) FROM {table}')
                print(f'✅ {table}: {cursor.fetchone()[0]} filas')
            except sqlite3.OperationalError:
                print(f'⚠️  Tabla {table} no existe todavía (se crea la primera vez que corre el collector/pipeline)')
        conn.close()
        "

  docker-compose-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # docker-compose.yml declara `env_file: .env`, y .env está en .gitignore
    # (contiene claves reales), así que en el runner no existe y `docker
    # compose config` fallaba con "env file ... .env not found" antes de
    # validar nada. Se usa la plantilla, que no tiene secretos.
    - name: Crear .env desde la plantilla
      run: cp .env.example .env

    - name: Validate docker-compose.yml
      run: docker compose config --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install black isort pylint

    # INFORMATIVOS (continue-on-error en vez de `|| true`): el código actual
    # no está formateado con black/isort. Cuando se aplique el formato, quitar
    # `continue-on-error` para volverlos bloqueantes.
    - name: Check code formatting
      continue-on-error: true
      run: |
        black src/ tests/ --check --line-length=120

    - name: Check import sorting
      continue-on-error: true
      run: |
        isort src/ tests/ --check-only
